default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  username: <%= ENV.fetch('DATABASE_USER', 'development') %>
  password: <%= ENV.fetch('DATABASE_PASSWORD', 'development') %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: phonerelax_development

test:
  <<: *default
  database: phonerelax_test

production:
  url: <%= ENV['DATABASE_URL'] %>
