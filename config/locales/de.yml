  how_it_works:
    title: "Wie funktioniert es?"
    p1: "Ganz einfach: Legen Sie das Handy in die PhoneRelax-Tasche und drücken Sie den Knopf des Verschlusses, damit das Handy versiegelt in der Tasche bleibt."
    p2: "Der größte Vorteil: Der Besitzer des Handys verwahrt sein Gerät selbst in der PhoneRelax-Tasche, bis es wieder benutzt werden darf."
    p3: "Um das Handy freizugeben, halten Sie den Verschluss der PhoneRelax-Tasche einfach an unseren speziellen PhoneRelax-Magneten, öffnen die Tasche und entnehmen das Handy."
    p4: "Es gibt zwei Varianten der PhoneRelax-Tasche: eine Version mit Tasche und Siegelverschluss und eine SignalBlocking-Version, die zusätzlich Mobilfunk- und WLAN-Signal blockiert; das Handy bleibt ohne Empfang und stört weder durch Anrufe noch durch Benachrichtigungen."
    video_alt: PhoneRelax-Video
    faq_title: Häufige Fragen
    meta_description: "So funktioniert PhoneRelax: Handy in die Magnettasche legen, verschließen und zum vereinbarten Zeitpunkt wieder entnehmen. Ein einfacher Weg zu ablenkungsfreien Klassenzimmern und Veranstaltungen."
    faq:
      q1: "Wie funktioniert die PhoneRelax-Tasche?"
      a1: "Sie legen das Handy in die Tasche und drücken den Knopf des Verschlusses, damit es versiegelt bleibt. Zum Öffnen halten Sie den Verschluss an den speziellen PhoneRelax-Magneten und die Tasche öffnet sich."
      q2: "Wer verwahrt das Handy?"
      a2: "Der Besitzer selbst: Er behält es in seiner PhoneRelax-Tasche, bis es wieder benutzt werden darf."
      q3: "Blockiert PhoneRelax Empfang und WLAN?"
      a3: "Die SignalBlocking-Version ja: Sie blockiert Mobilfunk- und WLAN-Signal, das Handy bleibt ohne Empfang und stört weder durch Anrufe noch durch Benachrichtigungen. Die Basisversion versiegelt nur die Tasche."
      q4: "Kann man die Tasche ohne den Magneten öffnen?"
      a4: "Nein. Der Verschluss der PhoneRelax-Tasche öffnet sich nur, wenn man ihn an den speziellen PhoneRelax-Magneten hält."
      q5: "Wo wird PhoneRelax eingesetzt?"
      a5: "In Klassenzimmern und Schulen sowie bei Veranstaltungen und in Räumen, in denen Handynutzung und Ablenkungen vermieden werden sollen."
