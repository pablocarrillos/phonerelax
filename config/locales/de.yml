      meta_title: "PhoneRelax für Schulen"
      meta_description: "Klassenzimmer ohne Ablenkungen und Prüfungen ohne Betrug: Jeder Schüler verwahrt sein Handy in einer magnetischen PhoneRelax-Tasche. Mengenrabatte für Schulen."
      title: "PhoneRelax für Schulen"
      subtitle: "Klassenzimmer ohne Ablenkungen und Prüfungen ohne Betrug — jeder Schüler verwahrt sein eigenes Handy."
      intro: "Immer mehr Länder beschränken die Handynutzung im Unterricht — in Deutschland haben mehrere Bundesländer verbindliche Verbote eingeführt. Mit PhoneRelax verwahrt jeder Schüler sein Handy in einer Magnettasche, die sich nur mit dem Magneten der Schule öffnen lässt: kein Einsammeln der Handys und keine Verantwortung für die Lehrkräfte."
      b1_title: "Mehr Konzentration"
      b1_body: "Ohne die Versuchung, aufs Handy zu schauen, sind die Schüler aufmerksamer und beteiligen sich mehr am Unterricht."
      b2_title: "Prüfungen ohne Betrug"
      b2_body: "Die SignalBlocking-Version lässt das Handy ohne Empfang und WLAN und verhindert Abschreiben oder Benachrichtigungen während der Prüfungen."
      b3_title: "Keine Verantwortung für die Lehrkraft"
      b3_body: "Jeder Schüler verwahrt sein eigenes Handy in seiner Tasche; die Schule haftet nicht für etwaige Schäden."
    eventos:
      meta_title: "PhoneRelax für Veranstaltungen und Konzerte"
      meta_description: "Handyfreie Erlebnisse bei Konzerten und Veranstaltungen: keine Aufnahmen, keine Spoiler, schnelle Ausgabe und Rücknahme. Fordern Sie ein Angebot für Ihre Veranstaltung an."
      title: "PhoneRelax für Veranstaltungen und Konzerte"
      subtitle: "Handyfreie Erlebnisse: keine Aufnahmen, keine Spoiler und ein Publikum, das den Moment genießt."
      intro: "Handyfreie Veranstaltungen („phone-free events“) liegen im Trend. Mit PhoneRelax verwahren die Teilnehmer ihr Handy in einer versiegelten Tasche, die sie am Ausgang öffnen: Sie genießen die Show und respektieren den Künstler."
      b1_title: "Ein intensiveres Erlebnis"
      b1_body: "Ohne Bildschirme erlebt das Publikum den Moment und verbindet sich mit dem Künstler und den anderen Teilnehmern."
      b2_title: "Keine Leaks, keine Spoiler"
      b2_body: "Ideal für Previews, Shows und Präsentationen, bei denen nichts aufgenommen oder verbreitet werden soll."
      b3_title: "Schnelle Ausgabe und Rücknahme"
      b3_body: "Ein einfaches System: Ausgabe am Eingang, Öffnung mit dem Magneten am Ausgang — ohne Warteschlangen und Komplikationen."
    empresas:
      meta_title: "PhoneRelax für Unternehmen"
      meta_description: "Besprechungen, Werksbesichtigungen und vertrauliche Bereiche ohne Handys und Kameras. Magnetische PhoneRelax-Taschen mit Angebot für Unternehmen."
      title: "PhoneRelax für Unternehmen"
      subtitle: "Besprechungen, Werksbesichtigungen und vertrauliche Bereiche ohne Handys und Kameras."
      intro: "Schützen Sie Vertraulichkeit und Konzentration in Ihrem Unternehmen. Besucher und Mitarbeiter verwahren ihr Handy in einer versiegelten Tasche in den Bereichen, in denen es nicht benutzt werden darf."
      b1_title: "Vertraulichkeit"
      b1_body: "Verhindern Sie Fotos und Aufnahmen in sensiblen Bereichen, Laboren, Produktionslinien oder strategischen Besprechungen."
      b2_title: "Produktivere Besprechungen"
      b2_body: "Ohne Unterbrechungen und Ablenkungen sind Besprechungen kürzer und effektiver."
      b3_title: "Einfach einzuführen"
      b3_body: "Keine Schließfächer, keine Infrastruktur: wiederverwendbare Taschen und ein Öffnungsmagnet pro Bereich."
    oposiciones:
      meta_title: "PhoneRelax für Prüfungen und Auswahlverfahren"
      meta_description: "Prüfungen und Auswahlverfahren ohne Betrug: Die Handys bleiben versiegelt und ohne Empfang in einer magnetischen PhoneRelax-Tasche. Angebot für Bildungszentren und Prüfungskommissionen."
      title: "PhoneRelax für Prüfungen und Auswahlverfahren"
      subtitle: "Prüfungen ohne Betrug: Die Handys bleiben während der Prüfung versiegelt und ohne Empfang."
      intro: "Bei Prüfungen und Auswahlverfahren ist das Handy der häufigste Betrugsweg. Mit der SignalBlocking-Version von PhoneRelax bleibt das Handy bis zum Ende der Prüfung versiegelt und ohne Signal."
      b1_title: "Kein Empfang, kein Betrug"
      b1_body: "Die SignalBlocking-Version blockiert Mobilfunk- und WLAN-Signal: keine Antworten oder Benachrichtigungen von außen."
      b2_title: "Der Prüfling verwahrt sein Handy selbst"
      b2_body: "Jeder verwahrt sein Handy in seiner eigenen Tasche: schnelle Ausgabe und kein Hantieren mit fremden Geräten."
      b3_title: "Einfache Handhabung für die Prüfungskommission"
      b3_body: "Ausgabe beim Einlass und Öffnung mit dem Magneten am Ausgang; ein einheitliches, klares System für alle."
