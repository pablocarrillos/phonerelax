  how_it_works:
    title: "Comment ça marche ?"
    p1: "C'est très simple : il suffit de placer le téléphone dans la pochette PhoneRelax et d'appuyer sur le bouton de son verrou pour que le téléphone reste scellé à l'intérieur."
    p2: "Le principal avantage est que c'est le propriétaire du téléphone lui-même qui garde son appareil dans la pochette PhoneRelax jusqu'au moment de le réutiliser."
    p3: "Pour libérer le téléphone, il suffit d'approcher le verrou de la pochette PhoneRelax de notre aimant spécial PhoneRelax afin de l'ouvrir et de sortir le téléphone."
    p4: "Nous proposons deux types de pochettes PhoneRelax : une version avec la pochette et son verrou de scellage, et une version SignalBlocking qui bloque en plus le signal mobile et le wifi ; le téléphone reste alors sans réseau et ne dérange ni par les appels entrants ni par les notifications."
    video_alt: Vidéo PhoneRelax
    faq_title: Questions fréquentes
    meta_description: "Comment fonctionne PhoneRelax : rangez le téléphone dans la pochette magnétique, fermez-la et récupérez-le le moment venu. Un moyen simple de créer des espaces sans distractions en classe et lors d'événements."
    faq:
      q1: "Comment fonctionne la pochette PhoneRelax ?"
      a1: "Vous placez le téléphone dans la pochette et appuyez sur le bouton de son verrou pour qu'il reste scellé à l'intérieur. Pour le libérer, approchez le verrou de l'aimant spécial PhoneRelax et la pochette s'ouvre."
      q2: "Qui garde le téléphone ?"
      a2: "Le propriétaire du téléphone lui-même : il le conserve dans sa pochette PhoneRelax jusqu'au moment de le réutiliser."
      q3: "PhoneRelax bloque-t-il le réseau et le wifi ?"
      a3: "La version SignalBlocking, oui : elle bloque le signal mobile et le wifi, le téléphone reste donc sans réseau et ne dérange ni par les appels ni par les notifications. La version basique se contente de sceller la pochette."
      q4: "Peut-on ouvrir la pochette sans l'aimant ?"
      a4: "Non. Le verrou de la pochette PhoneRelax ne s'ouvre qu'en l'approchant de l'aimant spécial PhoneRelax."
      q5: "Où utilise-t-on PhoneRelax ?"
      a5: "Dans les salles de classe et les établissements scolaires, ainsi que lors d'événements et dans les espaces où l'on souhaite éviter l'usage du téléphone et les distractions."
