    colegios:
      meta_title: "PhoneRelax pour les écoles, collèges et lycées"
      meta_description: "Des classes sans distractions et des examens sans fraude : chaque élève range son téléphone dans une pochette magnétique PhoneRelax. Remises sur volume pour les établissements scolaires."
      title: "PhoneRelax pour les écoles, collèges et lycées"
      subtitle: "Des classes sans distractions et des examens sans fraude, chaque élève gardant son propre téléphone."
      intro: "De plus en plus de pays limitent l'usage du téléphone en classe — en France, le dispositif « portable en pause » se généralise dans les collèges. Avec PhoneRelax, chaque élève range son téléphone dans une pochette magnétique qui ne s'ouvre qu'avec l'aimant de l'établissement : pas de collecte des téléphones ni de responsabilité pour les enseignants."
      b1_title: "Plus de concentration"
      b1_body: "Sans la tentation de regarder le téléphone, les élèves sont plus attentifs et participent davantage en classe."
      b2_title: "Des examens sans fraude"
      b2_body: "La version SignalBlocking laisse le téléphone sans réseau ni wifi, empêchant de copier ou de recevoir des notifications pendant les épreuves."
      b3_title: "Aucune responsabilité pour l'enseignant"
      b3_body: "Chaque élève garde son propre téléphone dans sa pochette ; l'établissement n'est pas responsable d'éventuels dommages."
    eventos:
      meta_title: "PhoneRelax pour les événements et les concerts"
      meta_description: "Des expériences sans téléphones dans les concerts et les événements : pas d'enregistrements ni de spoilers, distribution et récupération rapides. Demandez un devis pour votre événement."
      title: "PhoneRelax pour les événements et les concerts"
      subtitle: "Des expériences sans téléphones : pas d'enregistrements, pas de spoilers et un public connecté à l'instant présent."
      intro: "Les événements sans téléphones (« phone-free events ») sont en plein essor. Avec PhoneRelax, les participants rangent leur téléphone dans une pochette scellée qu'ils ouvrent à la sortie : ils profitent du spectacle et respectent l'artiste."
      b1_title: "Une expérience plus immersive"
      b1_body: "Sans écrans, le public vit le moment et se connecte à l'artiste et aux autres participants."
      b2_title: "Ni fuites ni spoilers"
      b2_body: "Idéal pour les avant-premières, les spectacles et les présentations où rien ne doit être enregistré ni divulgué."
      b3_title: "Distribution et récupération rapides"
      b3_body: "Un système simple de remise et d'ouverture avec aimant à la sortie, sans files d'attente ni complications."
    empresas:
      meta_title: "PhoneRelax pour les entreprises"
      meta_description: "Réunions, visites d'usine et zones confidentielles sans téléphones ni caméras. Pochettes magnétiques PhoneRelax avec devis pour les entreprises."
      title: "PhoneRelax pour les entreprises"
      subtitle: "Réunions, visites d'usine et zones confidentielles sans téléphones ni caméras."
      intro: "Protégez la confidentialité et la concentration dans votre entreprise. Visiteurs et employés rangent leur téléphone dans une pochette scellée dans les zones où il ne doit pas être utilisé."
      b1_title: "Confidentialité"
      b1_body: "Évitez les photos et les enregistrements dans les zones sensibles, les laboratoires, les lignes de production ou les réunions stratégiques."
      b2_title: "Des réunions plus productives"
      b2_body: "Sans interruptions ni distractions, les réunions sont plus courtes et plus efficaces."
      b3_title: "Facile à mettre en place"
      b3_body: "Ni coffres-forts ni infrastructure : des pochettes réutilisables et un aimant d'ouverture par zone."
    oposiciones:
      meta_title: "PhoneRelax pour les examens et les concours"
      meta_description: "Des examens et des concours sans fraude : les téléphones restent scellés et sans réseau dans une pochette magnétique PhoneRelax. Devis pour les centres de formation et les jurys."
      title: "PhoneRelax pour les examens et les concours"
      subtitle: "Des examens sans fraude : les téléphones restent scellés et sans réseau pendant l'épreuve."
      intro: "Lors des examens et des concours, le téléphone est la principale voie de fraude. Avec la version SignalBlocking de PhoneRelax, le téléphone reste scellé et sans signal jusqu'à la fin de l'épreuve."
      b1_title: "Pas de réseau, pas de fraude"
      b1_body: "La version SignalBlocking bloque le signal mobile et le wifi : impossible de recevoir des réponses ou des notifications."
      b2_title: "Le candidat garde lui-même son téléphone"
      b2_body: "Chacun range son téléphone dans sa pochette : distribution rapide et aucune manipulation d'appareils d'autrui."
      b3_title: "Une gestion simple pour le jury"
      b3_body: "Distribution à l'entrée et ouverture avec aimant à la sortie ; un système uniforme et clair pour tous."
