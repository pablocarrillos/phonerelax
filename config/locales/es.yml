      meta_description: "Aulas sin distracciones y exámenes sin fraude: los alumnos guardan su móvil en una bolsa magnética PhoneRelax. Descuentos por volumen para centros educativos."
      title: "PhoneRelax para colegios e institutos"
      subtitle: "Aulas sin distracciones y exámenes sin fraude, con los móviles custodiados por los propios alumnos."
      intro: "Cada vez más comunidades limitan el uso del móvil en las aulas. Con PhoneRelax, cada alumno guarda su teléfono en una bolsa magnética que solo se abre con el imán del centro: sin recoger móviles ni tener que custodiarlos el profesorado."
      b1_title: "Más concentración"
      b1_body: "Sin la tentación de mirar el móvil, los alumnos prestan más atención y participan más en clase."
      b2_title: "Exámenes sin fraude"
      b2_body: "La versión SignalBlocking deja el móvil sin cobertura ni wifi, evitando copiar o recibir notificaciones durante las pruebas."
      b3_title: "Sin responsabilidad para el profesor"
      b3_body: "Cada alumno custodia su propio teléfono en su bolsa; el centro no se hace responsable de posibles daños."
    eventos:
      meta_title: "PhoneRelax para eventos y conciertos"
      meta_description: "Experiencias sin móviles en conciertos y eventos: sin grabaciones ni spoilers, con reparto y recogida rápidos. Pide presupuesto para tu evento."
      title: "PhoneRelax para eventos y conciertos"
      subtitle: "Experiencias sin móviles: sin grabaciones, sin spoilers y con el público conectado al momento."
      intro: "Los eventos libres de móviles («phone-free events») están en auge. Con PhoneRelax, los asistentes guardan el móvil en una bolsa sellada que abren al salir: disfrutan del espectáculo y respetan al artista."
      b1_title: "Experiencia más inmersiva"
      b1_body: "Sin pantallas de por medio, el público vive el momento y conecta con el artista y con los demás asistentes."
      b2_title: "Sin filtraciones ni spoilers"
      b2_body: "Ideal para preestrenos, shows y presentaciones donde no quieres que se grabe ni se filtre nada."
      b3_title: "Reparto y recogida ágiles"
      b3_body: "Sistema sencillo de entrega y apertura con imán a la salida, sin colas ni complicaciones."
    empresas:
      meta_title: "PhoneRelax para empresas"
      meta_description: "Reuniones, visitas a planta y zonas confidenciales sin móviles ni cámaras. Bolsas magnéticas PhoneRelax con presupuesto para empresas."
      title: "PhoneRelax para empresas"
      subtitle: "Reuniones, visitas a planta y zonas confidenciales sin móviles ni cámaras."
      intro: "Protege la confidencialidad y la concentración en tu empresa. Visitantes y empleados guardan el móvil en una bolsa sellada en las zonas donde no debe utilizarse."
      b1_title: "Confidencialidad"
      b1_body: "Evita fotos y grabaciones en zonas sensibles, laboratorios, líneas de producción o reuniones estratégicas."
      b2_title: "Reuniones más productivas"
      b2_body: "Sin interrupciones ni distracciones, las reuniones son más cortas y eficaces."
      b3_title: "Fácil de implantar"
      b3_body: "Sin cajas fuertes ni infraestructura: bolsas reutilizables y un imán de apertura por zona."
    oposiciones:
      meta_title: "PhoneRelax para exámenes y oposiciones"
      meta_description: "Exámenes y oposiciones sin fraude: los móviles quedan sellados y sin cobertura en una bolsa magnética PhoneRelax. Presupuesto para academias y tribunales."
      title: "PhoneRelax para exámenes y oposiciones"
      subtitle: "Exámenes sin fraude: los móviles quedan sellados y sin cobertura durante la prueba."
      intro: "En exámenes y oposiciones el móvil es la principal vía de fraude. Con la versión SignalBlocking de PhoneRelax, el teléfono queda sellado y sin señal hasta que termina la prueba."
      b1_title: "Sin cobertura, sin fraude"
      b1_body: "La versión SignalBlocking bloquea la señal móvil y el wifi: nada de recibir respuestas o notificaciones."
      b2_title: "El propio opositor lo custodia"
      b2_body: "Cada persona guarda su móvil en su bolsa: rápido de repartir y sin manipular dispositivos ajenos."
      b3_title: "Gestión sencilla para el tribunal"
      b3_body: "Reparto al entrar y apertura con imán al salir; un sistema uniforme y claro para todos."
