    title: Quiénes somos
    intro: "PhoneRelax está situada en Alicante (España) y nace para dar solución a la problemática surgida con el uso de teléfonos móviles en colegios, institutos, conciertos y eventos privados."
    contact_data: Datos de contacto
    map_title: "Mapa: C/ Carrasqueta 13, Petrer"
    meta_description: "Conoce a PhoneRelax: ayudamos a colegios, institutos y organizadores de eventos a crear entornos sin distracciones con bolsas magnéticas para el móvil."
  how_it_works:
    title: "¿Cómo funciona?"
    p1: "Es muy sencillo, solo debes introducir el móvil en la bolsa PhoneRelax y apretar el botón de su cerradura para que el teléfono quede sellado dentro."
    p2: "La principal ventaja es que será el propio dueño del móvil el encargado de custodiar su teléfono dentro de la bolsa PhoneRelax hasta que sea el momento de volverlo a utilizar."
    p3: "Para liberar el móvil tan solo se debe acercar la cerradura de la bolsa PhoneRelax a nuestro imán especial PhoneRelax para poder abrirla y así sacar el teléfono de dentro."
    p4: "Disponemos de dos tipos diferentes de bolsas PhoneRelax: una versión que incluye la bolsa y la cerradura de sellado, y otra versión SignalBlocking que además es capaz de bloquear la señal móvil y wifi, por lo que el teléfono quedará sin cobertura y no molestará con llamadas entrantes o notificaciones."
    video_alt: Vídeo PhoneRelax
    faq_title: Preguntas frecuentes
    meta_description: "Cómo funciona PhoneRelax: guarda el móvil en la bolsa magnética, ciérrala y recupéralo cuando toque. Una forma sencilla de crear espacios sin distracciones en aulas y eventos."
    faq:
      q1: "¿Cómo funciona la bolsa PhoneRelax?"
      a1: "Introduces el móvil en la bolsa y aprietas el botón de su cerradura para que quede sellado dentro. Para liberarlo, acercas la cerradura al imán especial PhoneRelax y la bolsa se abre."
      q2: "¿Quién custodia el teléfono?"
      a2: "El propio dueño del móvil, que lo guarda dentro de su bolsa PhoneRelax hasta que llega el momento de volver a usarlo."
      q3: "¿PhoneRelax bloquea la cobertura y el wifi?"
      a3: "La versión SignalBlocking sí: bloquea la señal móvil y el wifi, por lo que el teléfono se queda sin cobertura y no molesta con llamadas ni notificaciones. La versión básica solo sella la bolsa."
      q4: "¿Se puede abrir la bolsa sin el imán?"
      a4: "No. La cerradura de la bolsa PhoneRelax solo se abre acercándola al imán especial PhoneRelax."
      q5: "¿Dónde se utiliza PhoneRelax?"
      a5: "En aulas y centros educativos, así como en eventos y espacios donde se quiere evitar el uso del móvil y las distracciones."
