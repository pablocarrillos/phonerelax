    title: About us
    intro: "PhoneRelax is based in Alicante (Spain) and was created to solve the problems caused by mobile phone use in schools, concerts and private events."
    contact_data: Contact details
    map_title: "Map: C/ Carrasqueta 13, Petrer"
    meta_description: "Meet PhoneRelax: we help schools and event organisers create distraction-free environments with magnetic phone pouches."
  how_it_works:
    title: How does it work?
    p1: "It's very simple: just put the phone in the PhoneRelax pouch and press its lock button so the phone is sealed inside."
    p2: "The main advantage is that the phone's owner is responsible for keeping their phone inside the PhoneRelax pouch until it's time to use it again."
    p3: "To release the phone, just bring the PhoneRelax pouch's lock close to our special PhoneRelax magnet to open it and take the phone out."
    p4: "We offer two different types of PhoneRelax pouches: one version that includes the pouch and the sealing lock, and a SignalBlocking version that can also block the mobile and wifi signal, so the phone has no reception and won't disturb you with incoming calls or notifications."
    video_alt: PhoneRelax video
    faq_title: Frequently asked questions
    meta_description: "How PhoneRelax works: store the phone in the magnetic pouch, close it and get it back when you need it. A simple way to create distraction-free spaces in classrooms and events."
    faq:
      q1: "How does the PhoneRelax pouch work?"
      a1: "You put the phone in the pouch and press its lock button so it's sealed inside. To release it, bring the lock close to the special PhoneRelax magnet and the pouch opens."
      q2: "Who keeps the phone?"
      a2: "The phone's owner, who keeps it inside their PhoneRelax pouch until it's time to use it again."
      q3: "Does PhoneRelax block signal and wifi?"
      a3: "The SignalBlocking version does: it blocks the mobile and wifi signal, so the phone has no reception and won't disturb you with calls or notifications. The basic version only seals the pouch."
      q4: "Can the pouch be opened without the magnet?"
      a4: "No. The PhoneRelax pouch's lock only opens by bringing it close to the special PhoneRelax magnet."
      q5: "Where is PhoneRelax used?"
      a5: "In classrooms and schools, as well as at events and spaces where phone use and distractions should be avoided."
