      meta_description: "Distraction-free classrooms and exams without cheating: students store their phone in a PhoneRelax magnetic pouch. Volume discounts for schools."
      title: "PhoneRelax for schools"
      subtitle: "Distraction-free classrooms and exams without cheating, with phones kept by the students themselves."
      intro: "More and more regions are limiting phone use in classrooms. With PhoneRelax, each student stores their phone in a magnetic pouch that only opens with the school's magnet: no collecting phones and no teachers having to keep them."
      b1_title: "Better focus"
      b1_body: "Without the temptation to check their phone, students pay more attention and take part more in class."
      b2_title: "Exams without cheating"
      b2_body: "The SignalBlocking version leaves the phone with no reception or wifi, preventing cheating or notifications during tests."
      b3_title: "No liability for teachers"
      b3_body: "Each student keeps their own phone in their pouch; the school is not liable for any damage."
    eventos:
      meta_title: "PhoneRelax for events and concerts"
      meta_description: "Phone-free experiences at concerts and events: no recording, no spoilers, with fast handout and collection. Request a quote for your event."
      title: "PhoneRelax for events and concerts"
      subtitle: "Phone-free experiences: no recording, no spoilers, with the audience connected to the moment."
      intro: "Phone-free events are on the rise. With PhoneRelax, attendees store their phone in a sealed pouch they open on the way out: they enjoy the show and respect the artist."
      b1_title: "A more immersive experience"
      b1_body: "With no screens in the way, the audience lives the moment and connects with the artist and other attendees."
      b2_title: "No leaks or spoilers"
      b2_body: "Ideal for previews, shows and presentations where you don't want anything recorded or leaked."
      b3_title: "Fast handout and collection"
      b3_body: "A simple handout system with magnet opening on the way out, with no queues or hassle."
    empresas:
      meta_title: "PhoneRelax for companies"
      meta_description: "Meetings, plant visits and confidential areas with no phones or cameras. PhoneRelax magnetic pouches with a quote for companies."
      title: "PhoneRelax for companies"
      subtitle: "Meetings, plant visits and confidential areas with no phones or cameras."
      intro: "Protect confidentiality and focus in your company. Visitors and employees store their phone in a sealed pouch in the areas where it shouldn't be used."
      b1_title: "Confidentiality"
      b1_body: "Prevents photos and recordings in sensitive areas, labs, production lines or strategic meetings."
      b2_title: "More productive meetings"
      b2_body: "With no interruptions or distractions, meetings are shorter and more effective."
      b3_title: "Easy to roll out"
      b3_body: "No safes or infrastructure: reusable pouches and one opening magnet per area."
    oposiciones:
      meta_title: "PhoneRelax for exams and official tests"
      meta_description: "Exams and official tests without cheating: phones stay sealed and with no reception in a PhoneRelax magnetic pouch. Quote for academies and boards."
      title: "PhoneRelax for exams and official tests"
      subtitle: "Exams without cheating: phones stay sealed and with no reception during the test."
      intro: "In exams and official tests, the phone is the main route for cheating. With the PhoneRelax SignalBlocking version, the phone stays sealed and with no signal until the test is over."
      b1_title: "No reception, no cheating"
      b1_body: "The SignalBlocking version blocks the mobile and wifi signal: no receiving answers or notifications."
      b2_title: "Each candidate keeps their own"
      b2_body: "Each person stores their phone in their pouch: fast to hand out and no handling of other people's devices."
      b3_title: "Simple management for the board"
      b3_body: "Handout on the way in and magnet opening on the way out; a uniform, clear system for everyone."
