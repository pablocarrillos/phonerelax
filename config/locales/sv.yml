  how_it_works:
    title: "Så fungerar det"
    p1: "Det är mycket enkelt: lägg mobilen i PhoneRelax-fickan och tryck på låsknappen så förseglas telefonen inuti."
    p2: "Den största fördelen är att mobilens ägare själv ansvarar för sin telefon i PhoneRelax-fickan tills det är dags att använda den igen."
    p3: "För att frigöra mobilen håller du bara PhoneRelax-fickans lås mot vår speciella PhoneRelax-magnet så öppnas fickan och du kan ta ut telefonen."
    p4: "Vi har två olika typer av PhoneRelax-fickor: en version med ficka och förseglingslås, och en SignalBlocking-version som dessutom blockerar mobil- och wifi-signalen, så att telefonen blir utan täckning och inte stör med inkommande samtal eller notiser."
    video_alt: PhoneRelax-video
    faq_title: Vanliga frågor
    meta_description: "Så fungerar PhoneRelax: lägg mobilen i den magnetiska fickan, stäng den och ta fram den när det är dags. Ett enkelt sätt att skapa miljöer utan distraktioner i klassrum och på evenemang."
    faq:
      q1: "Hur fungerar PhoneRelax-fickan?"
      a1: "Du lägger mobilen i fickan och trycker på låsknappen så att den förseglas inuti. För att frigöra den håller du låset mot den speciella PhoneRelax-magneten så öppnas fickan."
      q2: "Vem förvarar telefonen?"
      a2: "Mobilens ägare själv, som behåller den i sin PhoneRelax-ficka tills det är dags att använda den igen."
      q3: "Blockerar PhoneRelax täckning och wifi?"
      a3: "SignalBlocking-versionen gör det: den blockerar mobil- och wifi-signalen, så att telefonen blir utan täckning och inte stör med samtal eller notiser. Basversionen förseglar bara fickan."
      q4: "Kan fickan öppnas utan magneten?"
      a4: "Nej. PhoneRelax-fickans lås öppnas bara när det hålls mot den speciella PhoneRelax-magneten."
      q5: "Var används PhoneRelax?"
      a5: "I klassrum och skolor, samt på evenemang och i miljöer där man vill undvika mobilanvändning och distraktioner."
