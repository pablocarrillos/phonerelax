      title: "PhoneRelax för grundskolor och gymnasier"
      subtitle: "Klassrum utan distraktioner och prov utan fusk, med mobilerna förvarade av eleverna själva."
      intro: "Sedan den 1 augusti 2026 ska svenska grundskolor vara mobilfria under hela skoldagen. Med PhoneRelax förvarar varje elev sin telefon i en magnetisk ficka som bara öppnas med skolans magnet: ingen insamling av mobiler och inget ansvar för lärarna att förvara dem."
      b1_title: "Bättre koncentration"
      b1_body: "Utan frestelsen att titta på mobilen är eleverna mer uppmärksamma och deltar mer på lektionerna."
      b2_title: "Prov utan fusk"
      b2_body: "SignalBlocking-versionen lämnar mobilen utan täckning och wifi, vilket förhindrar fusk och notiser under proven."
      b3_title: "Inget ansvar för läraren"
      b3_body: "Varje elev förvarar sin egen telefon i sin ficka; skolan ansvarar inte för eventuella skador."
    eventos:
      meta_title: "PhoneRelax för evenemang och konserter"
      meta_description: "Mobilfria upplevelser på konserter och evenemang: inga inspelningar eller spoilers, med snabb utdelning och insamling. Begär offert för ditt evenemang."
      title: "PhoneRelax för evenemang och konserter"
      subtitle: "Mobilfria upplevelser: inga inspelningar, inga spoilers och en publik som är närvarande i stunden."
      intro: "Mobilfria evenemang («phone-free events») blir allt vanligare. Med PhoneRelax förvarar besökarna mobilen i en förseglad ficka som de öppnar när de går: de njuter av föreställningen och respekterar artisten."
      b1_title: "En mer uppslukande upplevelse"
      b1_body: "Utan skärmar emellan lever publiken i stunden och får kontakt med artisten och de andra besökarna."
      b2_title: "Inga läckor eller spoilers"
      b2_body: "Perfekt för förhandsvisningar, shower och presentationer där inget får spelas in eller läcka ut."
      b3_title: "Smidig utdelning och insamling"
      b3_body: "Enkelt system för utdelning och öppning med magnet vid utgången, utan köer eller krångel."
    empresas:
      meta_title: "PhoneRelax för företag"
      meta_description: "Möten, fabriksbesök och konfidentiella områden utan mobiler eller kameror. Magnetiska PhoneRelax-fickor med offert för företag."
      title: "PhoneRelax för företag"
      subtitle: "Möten, fabriksbesök och konfidentiella områden utan mobiler eller kameror."
      intro: "Skydda sekretessen och koncentrationen i ert företag. Besökare och anställda förvarar mobilen i en förseglad ficka i de områden där den inte får användas."
      b1_title: "Sekretess"
      b1_body: "Förhindrar foton och inspelningar i känsliga områden, laboratorier, produktionslinjer eller strategiska möten."
      b2_title: "Mer produktiva möten"
      b2_body: "Utan avbrott och distraktioner blir mötena kortare och effektivare."
      b3_title: "Enkelt att införa"
      b3_body: "Inga skåp eller infrastruktur: återanvändbara fickor och en öppningsmagnet per område."
    oposiciones:
      meta_title: "PhoneRelax för tentor och antagningsprov"
      meta_description: "Tentor och prov utan fusk: mobilerna förseglas utan täckning i en magnetisk PhoneRelax-ficka. Offert för utbildningsföretag och provanordnare."
      title: "PhoneRelax för tentor och antagningsprov"
      subtitle: "Prov utan fusk: mobilerna är förseglade och utan täckning under hela provet."
      intro: "Vid tentor och antagningsprov är mobilen den vanligaste vägen till fusk. Med PhoneRelax SignalBlocking-version är telefonen förseglad och utan signal tills provet är slut."
      b1_title: "Ingen täckning, inget fusk"
      b1_body: "SignalBlocking-versionen blockerar mobil- och wifi-signalen: inga svar eller notiser kan tas emot."
      b2_title: "Provdeltagaren förvarar den själv"
      b2_body: "Varje person förvarar sin mobil i sin egen ficka: snabbt att dela ut och ingen hanterar andras enheter."
      b3_title: "Enkel hantering för provanordnaren"
      b3_body: "Utdelning vid ingången och öppning med magnet vid utgången; ett enhetligt och tydligt system för alla."
