      title: "PhoneRelax til skoler"
      subtitle: "Distraktionsfrie klasseværelser og eksamener uden snyd, hvor eleverne selv har deres mobil i forvaring."
      intro: "Flere og flere regioner begrænser mobilbrug i klasseværelserne. Med PhoneRelax opbevarer hver elev sin mobil i en magnetisk pose, der kun åbnes med skolens magnet: ingen indsamling af mobiler, og lærerne skal ikke opbevare dem."
      b1_title: "Bedre fokus"
      b1_body: "Uden fristelsen til at tjekke mobilen er eleverne mere opmærksomme og deltager mere i timen."
      b2_title: "Eksamener uden snyd"
      b2_body: "SignalBlocking-versionen efterlader mobilen uden dækning eller wifi og forhindrer snyd eller notifikationer under prøver."
      b3_title: "Intet ansvar for lærerne"
      b3_body: "Hver elev har selv sin mobil i sin pose; skolen er ikke ansvarlig for eventuelle skader."
    eventos:
      meta_title: "PhoneRelax til arrangementer og koncerter"
      meta_description: "Mobilfri oplevelser til koncerter og arrangementer: ingen optagelser, ingen spoilers, med hurtig udlevering og indsamling. Bed om et tilbud til dit arrangement."
      title: "PhoneRelax til arrangementer og koncerter"
      subtitle: "Mobilfri oplevelser: ingen optagelser, ingen spoilers, med publikum forbundet til øjeblikket."
      intro: "Mobilfri arrangementer er i vækst. Med PhoneRelax opbevarer deltagerne deres mobil i en forseglet pose, som de åbner på vej ud: de nyder showet og respekterer kunstneren."
      b1_title: "En mere fordybende oplevelse"
      b1_body: "Uden skærme i vejen lever publikum i øjeblikket og forbinder sig med kunstneren og de øvrige deltagere."
      b2_title: "Ingen lækager eller spoilers"
      b2_body: "Ideelt til previews, shows og præsentationer, hvor du ikke ønsker, at noget optages eller lækkes."
      b3_title: "Hurtig udlevering og indsamling"
      b3_body: "Et enkelt udleveringssystem med magnetåbning på vej ud, uden køer eller besvær."
    empresas:
      meta_title: "PhoneRelax til virksomheder"
      meta_description: "Møder, fabriksbesøg og fortrolige områder uden mobiler eller kameraer. PhoneRelax magnetiske poser med tilbud til virksomheder."
      title: "PhoneRelax til virksomheder"
      subtitle: "Møder, fabriksbesøg og fortrolige områder uden mobiler eller kameraer."
      intro: "Beskyt fortrolighed og fokus i din virksomhed. Besøgende og medarbejdere opbevarer deres mobil i en forseglet pose i de områder, hvor den ikke bør bruges."
      b1_title: "Fortrolighed"
      b1_body: "Forhindrer fotos og optagelser i følsomme områder, laboratorier, produktionslinjer eller strategiske møder."
      b2_title: "Mere produktive møder"
      b2_body: "Uden afbrydelser eller distraktioner bliver møderne kortere og mere effektive."
      b3_title: "Nem at rulle ud"
      b3_body: "Ingen pengeskabe eller infrastruktur: genanvendelige poser og én åbningsmagnet pr. område."
    oposiciones:
