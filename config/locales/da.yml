  how_it_works:
    title: Sådan virker det
    p1: "Det er meget enkelt: læg blot mobilen i PhoneRelax-posen og tryk på låsen, så mobilen forsegles indeni."
    p2: "Den største fordel er, at mobilens ejer selv er ansvarlig for at have mobilen i PhoneRelax-posen, indtil den skal bruges igen."
    p3: "For at frigøre mobilen skal du blot holde PhoneRelax-posens lås tæt på vores særlige PhoneRelax-magnet for at åbne den og tage mobilen ud."
    p4: "Vi tilbyder to forskellige typer PhoneRelax-poser: en version med posen og forseglingslåsen, og en SignalBlocking-version, der desuden kan blokere mobil- og wifi-signalet, så mobilen ingen dækning har og ikke forstyrrer dig med indgående opkald eller notifikationer."
    video_alt: PhoneRelax-video
    faq_title: Ofte stillede spørgsmål
    meta_description: "Sådan virker PhoneRelax: opbevar mobilen i den magnetiske pose, luk den og få den igen, når du har brug for den. En enkel måde at skabe distraktionsfrie rum i klasseværelser og til arrangementer."
    faq:
      q1: "Hvordan virker PhoneRelax-posen?"
      a1: "Du lægger mobilen i posen og trykker på låsen, så den forsegles indeni. For at frigøre den holder du låsen tæt på den særlige PhoneRelax-magnet, og posen åbnes."
      q2: "Hvem har mobilen?"
      a2: "Mobilens ejer, som beholder den i sin PhoneRelax-pose, indtil den skal bruges igen."
      q3: "Blokerer PhoneRelax signal og wifi?"
      a3: "Det gør SignalBlocking-versionen: den blokerer mobil- og wifi-signalet, så mobilen ingen dækning har og ikke forstyrrer dig med opkald eller notifikationer. Basisversionen forsegler kun posen."
      q4: "Kan posen åbnes uden magneten?"
      a4: "Nej. PhoneRelax-posens lås åbnes kun ved at holde den tæt på den særlige PhoneRelax-magnet."
      q5: "Hvor bruges PhoneRelax?"
      a5: "I klasseværelser og skoler samt til arrangementer og i rum, hvor mobilbrug og distraktioner bør undgås."
