      b2_title: "Hver deltager har sin egen"
      b2_body: "Hver person opbevarer sin mobil i sin pose: hurtigt at udlevere og ingen håndtering af andres enheder."
      b3_title: "Enkel styring for prøvenævnet"
      b3_body: "Udlevering på vej ind og magnetåbning på vej ud; et ensartet og klart system for alle."
