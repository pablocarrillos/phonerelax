      title: "PhoneRelax til eksamener og officielle prøver"
      subtitle: "Eksamener uden snyd: mobilerne forbliver forseglede og uden dækning under prøven."
      intro: "Til eksamener og officielle prøver er mobilen den vigtigste vej til snyd. Med PhoneRelax SignalBlocking-versionen forbliver mobilen forseglet og uden signal, indtil prøven er slut."
      b1_title: "Ingen dækning, intet snyd"
