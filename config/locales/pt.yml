      subtitle: "Experiências sem telemóveis: sem gravações, sem spoilers e com o público ligado ao momento."
      intro: "Os eventos livres de telemóveis («phone-free events») estão em alta. Com a PhoneRelax, os espectadores guardam o telemóvel numa bolsa selada que abrem à saída: aproveitam o espetáculo e respeitam o artista."
      b1_title: "Experiência mais imersiva"
      b1_body: "Sem ecrãs pelo meio, o público vive o momento e liga-se ao artista e aos restantes espectadores."
      b2_title: "Sem fugas nem spoilers"
      b2_body: "Ideal para pré-estreias, espetáculos e apresentações onde não quer que se grave ou divulgue nada."
      b3_title: "Distribuição e recolha ágeis"
      b3_body: "Sistema simples de entrega e abertura com íman à saída, sem filas nem complicações."
    empresas:
      meta_title: "PhoneRelax para empresas"
      meta_description: "Reuniões, visitas a fábrica e zonas confidenciais sem telemóveis nem câmaras. Bolsas magnéticas PhoneRelax com orçamento para empresas."
      title: "PhoneRelax para empresas"
      subtitle: "Reuniões, visitas a fábrica e zonas confidenciais sem telemóveis nem câmaras."
      intro: "Proteja a confidencialidade e a concentração na sua empresa. Visitantes e colaboradores guardam o telemóvel numa bolsa selada nas zonas onde não deve ser utilizado."
      b1_title: "Confidencialidade"
      b1_body: "Evita fotografias e gravações em zonas sensíveis, laboratórios, linhas de produção ou reuniões estratégicas."
      b2_title: "Reuniões mais produtivas"
      b2_body: "Sem interrupções nem distrações, as reuniões são mais curtas e eficazes."
      b3_title: "Fácil de implementar"
      b3_body: "Sem cofres nem infraestrutura: bolsas reutilizáveis e um íman de abertura por zona."
    oposiciones:
