  how_it_works:
    title: Como funciona?
    p1: "É muito simples: basta introduzir o telemóvel na bolsa PhoneRelax e carregar no botão do fecho para que o telemóvel fique selado no interior."
    p2: "A principal vantagem é que será o próprio dono do telemóvel o responsável por guardar o seu telemóvel dentro da bolsa PhoneRelax até ser o momento de voltar a utilizá-lo."
    p3: "Para libertar o telemóvel basta aproximar o fecho da bolsa PhoneRelax do nosso íman especial PhoneRelax para poder abri-la e assim retirar o telemóvel."
    p4: "Dispomos de dois tipos de bolsas PhoneRelax: uma versão que inclui a bolsa e o fecho de selagem, e outra versão SignalBlocking que, além disso, é capaz de bloquear o sinal móvel e o wifi, pelo que o telemóvel fica sem rede e não incomoda com chamadas ou notificações."
    video_alt: Vídeo PhoneRelax
    faq_title: Perguntas frequentes
    meta_description: "Como funciona a PhoneRelax: guarde o telemóvel na bolsa magnética, feche-a e recupere-o quando quiser. Uma forma simples de criar espaços sem distrações em salas de aula e eventos."
    faq:
      q1: "Como funciona a bolsa PhoneRelax?"
      a1: "Introduz o telemóvel na bolsa e carrega no botão do fecho para que fique selado no interior. Para o libertar, aproxima o fecho do íman especial PhoneRelax e a bolsa abre-se."
      q2: "Quem guarda o telemóvel?"
      a2: "O próprio dono do telemóvel, que o guarda dentro da sua bolsa PhoneRelax até chegar o momento de voltar a usá-lo."
      q3: "A PhoneRelax bloqueia a rede e o wifi?"
      a3: "A versão SignalBlocking sim: bloqueia o sinal móvel e o wifi, pelo que o telemóvel fica sem rede e não incomoda com chamadas nem notificações. A versão básica apenas sela a bolsa."
      q4: "É possível abrir a bolsa sem o íman?"
      a4: "Não. O fecho da bolsa PhoneRelax só abre aproximando-o do íman especial PhoneRelax."
      q5: "Onde se utiliza a PhoneRelax?"
      a5: "Em salas de aula e escolas, bem como em eventos e espaços onde se pretende evitar o uso do telemóvel e as distrações."
