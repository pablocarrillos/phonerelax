      subtitle: "Exames sem fraude: os telemóveis ficam selados e sem rede durante a prova."
      intro: "Em exames e concursos, o telemóvel é a principal via de fraude. Com a versão SignalBlocking da PhoneRelax, o telemóvel fica selado e sem sinal até ao fim da prova."
