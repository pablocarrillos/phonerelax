      subtitle: "Salas de aula sem distrações e exames sem fraude, com os telemóveis guardados pelos próprios alunos."
      intro: "Cada vez mais se limita o uso do telemóvel nas salas de aula. Com a PhoneRelax, cada aluno guarda o telemóvel numa bolsa magnética que só abre com o íman da escola: sem recolher telemóveis nem os professores terem de os guardar."
