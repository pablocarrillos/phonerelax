  how_it_works:
    title: Come funziona
    p1: "È molto semplice: metti il telefono nella custodia PhoneRelax e premi la serratura così il telefono resta sigillato all'interno."
    p2: "Il vantaggio principale è che il proprietario del telefono è responsabile di custodirlo nella custodia PhoneRelax finché non sarà il momento di usarlo di nuovo."
    p3: "Per liberare il telefono, avvicina la serratura della custodia PhoneRelax al nostro speciale magnete PhoneRelax per aprirla ed estrarre il telefono."
    p4: "Offriamo due tipi diversi di custodie PhoneRelax: una versione con la custodia e la serratura di sigillo, e una versione SignalBlocking che può anche bloccare il segnale del cellulare e del wifi, così il telefono resta senza ricezione e non ti disturba con chiamate o notifiche in arrivo."
    video_alt: Video PhoneRelax
    faq_title: Domande frequenti
    meta_description: "Come funziona PhoneRelax: riponi il telefono nella custodia magnetica, chiudila e riprendilo quando ne hai bisogno. Un modo semplice per creare spazi senza distrazioni in aula e agli eventi."
    faq:
      q1: "Come funziona la custodia PhoneRelax?"
      a1: "Metti il telefono nella custodia e premi la serratura così resta sigillato all'interno. Per liberarlo, avvicina la serratura allo speciale magnete PhoneRelax e la custodia si apre."
      q2: "Chi custodisce il telefono?"
      a2: "Il proprietario del telefono, che lo tiene nella sua custodia PhoneRelax finché non sarà il momento di usarlo di nuovo."
      q3: "PhoneRelax blocca il segnale e il wifi?"
      a3: "Lo fa la versione SignalBlocking: blocca il segnale del cellulare e del wifi, così il telefono resta senza ricezione e non ti disturba con chiamate o notifiche. La versione base sigilla soltanto la custodia."
      q4: "La custodia si può aprire senza il magnete?"
      a4: "No. La serratura della custodia PhoneRelax si apre solo avvicinandola allo speciale magnete PhoneRelax."
      q5: "Dove si usa PhoneRelax?"
      a5: "In aula e nelle scuole, oltre che agli eventi e negli spazi dove è meglio evitare l'uso del telefono e le distrazioni."
