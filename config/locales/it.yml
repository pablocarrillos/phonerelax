      b1_title: "Riservatezza"
      b1_body: "Evita foto e registrazioni in aree sensibili, laboratori, linee di produzione o riunioni strategiche."
      b2_title: "Riunioni più produttive"
      b2_body: "Senza interruzioni né distrazioni, le riunioni sono più brevi ed efficaci."
      b3_title: "Facile da implementare"
      b3_body: "Niente casseforti o infrastrutture: custodie riutilizzabili e un magnete di apertura per ogni area."
