      title: "PhoneRelax per le scuole"
      subtitle: "Aule senza distrazioni ed esami senza imbrogli, con i telefoni custoditi dagli studenti stessi."
      intro: "Sempre più regioni limitano l'uso del telefono in aula. Con PhoneRelax, ogni studente ripone il telefono in una custodia magnetica che si apre solo con il magnete della scuola: niente ritiro dei telefoni e nessun insegnante costretto a custodirli."
