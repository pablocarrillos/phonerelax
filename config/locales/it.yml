      b1_body: "Senza la tentazione di controllare il telefono, gli studenti prestano più attenzione e partecipano di più in classe."
      b2_title: "Esami senza imbrogli"
      b2_body: "La versione SignalBlocking lascia il telefono senza ricezione né wifi, evitando imbrogli o notifiche durante le prove."
      b3_title: "Nessuna responsabilità per gli insegnanti"
      b3_body: "Ogni studente custodisce il proprio telefono nella sua custodia; la scuola non è responsabile di eventuali danni."
    eventos:
      meta_title: "PhoneRelax per eventi e concerti"
      meta_description: "Esperienze senza telefono ai concerti e agli eventi: niente riprese, niente spoiler, con consegna e ritiro rapidi. Richiedi un preventivo per il tuo evento."
      title: "PhoneRelax per eventi e concerti"
      subtitle: "Esperienze senza telefono: niente riprese, niente spoiler, con il pubblico immerso nel momento."
      intro: "Gli eventi senza telefono sono in crescita. Con PhoneRelax, i partecipanti ripongono il telefono in una custodia sigillata che aprono all'uscita: si godono lo spettacolo e rispettano l'artista."
      b1_title: "Un'esperienza più immersiva"
      b1_body: "Senza schermi di mezzo, il pubblico vive il momento e si connette con l'artista e gli altri partecipanti."
      b2_title: "Niente fughe di notizie o spoiler"
      b2_body: "Ideale per anteprime, spettacoli e presentazioni in cui non vuoi che nulla venga registrato o diffuso."
      b3_title: "Consegna e ritiro rapidi"
      b3_body: "Un semplice sistema di consegna con apertura a magnete all'uscita, senza code né complicazioni."
    empresas:
      meta_title: "PhoneRelax per le aziende"
      meta_description: "Riunioni, visite in stabilimento e aree riservate senza telefoni né fotocamere. Custodie magnetiche PhoneRelax con preventivo per le aziende."
